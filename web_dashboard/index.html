<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Time Stress Monitoring System</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Real Time Stress Monitoring System</h1>

    <div class="card">
        <h2>Heart Rate</h2>
        <div id="heart-rate">0 BPM</div>
    </div>

    <div class="card">
        <h2>SpO₂</h2>
        <div id="spo2">0 %</div>
    </div>

    <div class="card">
        <h2>Temperature</h2>
        <div id="temperature">0 °C</div>
    </div>

    <div class="card">
        <h2>GSR</h2>
        <div id="gsr">0</div>
    </div>

    <script src="dashboard.js"></script>

</body>
</html>
